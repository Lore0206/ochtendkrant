name: Feeds ophalen

# Haalt het VRT-nieuws en de BrainyQuote-quotes op en bewaart ze in data/feeds.json.
# De krant leest dat bestand, zodat de browser de feeds niet zelf hoeft op te halen.

on:
  schedule:
    - cron: '15 4,10,16 * * *'   # drie keer per dag (UTC)
  workflow_dispatch:              # ook handmatig te starten
  push:
    paths:
      - '.github/workflows/feeds.yml'

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feeds ophalen
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, os, re, sys, html, datetime, urllib.request
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo

          NIEUWS = os.environ.get("NIEUWS_URL", "https://www.vrt.be/vrtnws/nl.rss.articles.xml")
          QUOTES = os.environ.get("QUOTE_URL", "https://www.brainyquote.com/link/quotebr.rss")
          UIT = "data/feeds.json"
          UA = {"User-Agent": "Mozilla/5.0 (compatible; Ochtendkrant/1.0)"}

          def haal(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  return r.read()

          def naam(el):
              return el.tag.split("}")[-1]

          def tekst(el, n):
              for c in el:
                  if naam(c) == n:
                      return (c.text or "").strip()
              return ""

          def link(el):
              for c in el:
                  if naam(c) == "link":
                      if c.get("href") and c.get("rel", "alternate") == "alternate":
                          return c.get("href")
                      if c.text and c.text.strip():
                          return c.text.strip()
              return ""

          def plat(h):
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", html.unescape(h))).strip()

          def nieuws(url):
              uit = []
              for e in ET.fromstring(haal(url)).iter():
                  if naam(e) not in ("entry", "item"):
                      continue
                  titel = plat(tekst(e, "title"))
                  sam = plat(tekst(e, "summary") or tekst(e, "description"))
                  if titel and len(sam) >= 60:  # liveblogs zonder samenvatting slaan we over
                      uit.append({"titel": titel, "samenvatting": sam, "link": link(e)})
                  if len(uit) >= 8:
                      break
              return uit

          def quotes(url):
              uit = []
              for e in ET.fromstring(haal(url)).iter():
                  if naam(e) != "item":
                      continue
                  titel, besch, l = plat(tekst(e, "title")), plat(tekst(e, "description")), link(e)
                  q, a = besch, titel
                  if not q and titel[:1] in ('"', "\u201c"):
                      q, a = titel, ""
                  if not a:
                      m = re.search(r"/authors/(.+?)-quotes", l)
                      a = m.group(1).replace("-", " ").title() if m else ""
                  q = q.strip().strip('"\u201c\u201d').strip()
                  if q:
                      uit.append({"tekst": q, "auteur": a})
              return uit

          oud = {}
          if os.path.exists(UIT):
              try:
                  oud = json.load(open(UIT, encoding="utf-8"))
              except Exception:
                  oud = {}

          nieuw = {"nieuws": oud.get("nieuws", []), "quotes": oud.get("quotes", [])}
          fouten = []
          for sleutel, functie, url in (("nieuws", nieuws, NIEUWS), ("quotes", quotes, QUOTES)):
              try:
                  gevonden = functie(url)
                  if not gevonden:
                      raise ValueError("lege feed")
                  nieuw[sleutel] = gevonden
              except Exception as fout:
                  fouten.append("%s: %s" % (sleutel, fout))
                  print("Mislukt:", sleutel, fout, file=sys.stderr)

          if len(fouten) == 2 and not oud:
              sys.exit("Beide feeds mislukt en er is nog geen oud bestand")

          nieuw["datum"] = datetime.datetime.now(ZoneInfo("Europe/Brussels")).strftime("%Y-%m-%d")
          with open(UIT, "w", encoding="utf-8") as f:
              json.dump(nieuw, f, ensure_ascii=False, indent=1)
          print("Klaar:", len(nieuw["nieuws"]), "nieuwsberichten,", len(nieuw["quotes"]), "quotes")
          PY

      - name: Opslaan
        run: |
          git config user.name "ochtendkrant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feeds.json
          git diff --cached --quiet || (git commit -m "Feeds bijgewerkt" && git push)
